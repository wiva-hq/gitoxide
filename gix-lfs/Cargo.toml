lints.workspace = true

[package]
name = "gix-lfs"
version = "0.0.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project implementing Git LFS pointers, the local object store and the batch API client"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.95"
include = ["/src/**/*", "/LICENSE-*"]

[lib]
doctest = false

[features]
## Provide a blocking HTTP client for the batch API and transfers, implemented with `reqwest`.
## `https://` URLs need a TLS backend enabled on `reqwest` by the application,
## for example through `gix-transport/http-client-reqwest-rust-tls`.
http-client-reqwest = ["dep:reqwest"]

[dependencies]
gix-error = { version = "^0.5.2", path = "../gix-error" }
gix-trace = { version = "^0.3.1", path = "../gix-trace" }
gix-utils = { version = "^0.5.2", path = "../gix-utils", features = ["progress"] }
gix-tempfile = { version = "^27.0.0", path = "../gix-tempfile", default-features = false }
gix-url = { version = "^0.40.1", path = "../gix-url" }
gix-sec = { version = "^0.16.1", path = "../gix-sec" }
gix-credentials = { version = "^0.42.1", path = "../gix-credentials" }
gix-command = { version = "^0.12.1", path = "../gix-command" }
gix-quote = { version = "^0.10.1", path = "../gix-quote" }

bstr = { version = "1.12.0", default-features = false, features = ["std"] }
serde = { version = "1.0.114", features = ["derive"] }
serde_json = "1.0.150"
sha2 = { version = "0.11.0", default-features = false }
base64 = "0.23.1"
reqwest = { version = "0.13.4", optional = true, default-features = false, features = ["blocking"] }

[dev-dependencies]
gix-lfs = { path = ".", features = ["http-client-reqwest"] }
gix-testtools = { path = "../tests/tools", features = ["sha1"] }

[package.metadata.qa]
checks = [{ args = ["--no-default-features", "--lib"] }]
